<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Monday Briefing</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#efe9dd;color:#19261f;font:16px/1.5 system-ui,sans-serif}.card{width:min(92vw,430px);background:#fffdf8;border:1px solid #d8d0c2;border-radius:22px;padding:38px;box-shadow:0 20px 60px #5e4c3320}.mark{font:700 12px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:#a0442f}.eyebrow{font:italic 18px Georgia,serif;color:#617068;margin:18px 0 6px}h1{font:600 42px/1.02 Georgia,serif;margin:0 0 12px}p{color:#68736d}label{display:block;font-weight:650;margin:28px 0 8px}input{width:100%;border:1px solid #bbb3a6;border-radius:10px;padding:14px;font:inherit;background:#fff;color:#19261f}button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:14px;background:#193d2d;color:#fff;font:700 15px system-ui;cursor:pointer}.error{background:#fff0ed;color:#8d2f21;padding:10px 12px;border-radius:8px}@media(prefers-color-scheme:dark){body{background:#101713;color:#ecede7}.card{background:#18221d;border-color:#33443a}.eyebrow,p{color:#aebbb3}input{background:#101713;color:#fff;border-color:#56635b}}</style></head>
<body><main class="card"><div class="mark">Monday Briefing</div><div class="eyebrow">Your week, made legible.</div><h1>Welcome back.</h1><p>Sign in to read, learn and shape next Monday’s course.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus {% if locked %}disabled{% endif %}><button {% if locked %}disabled{% endif %}>Open my briefing</button></form></main></body></html>
