<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4efe4"><title>Monday Briefing</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><header class="masthead"><a class="brand" href="#">Daily <i>Briefing</i></a><div class="header-actions"><button id="theme" class="icon-btn" aria-label="Toggle colour theme">◐</button><form action="/logout" method="post"><button class="text-btn">Sign out</button></form></div></header>
<nav class="tabs" aria-label="Main sections"><button class="tab active" data-tab="briefing">Briefing</button><button class="tab" data-tab="quiz">Quiz</button><button class="tab" data-tab="progress">My progress</button><button class="tab" data-tab="archive">Archive</button></nav>
<div id="mode-banner" class="mode-banner hidden"></div><div id="build-banner" class="build-banner hidden"></div>
<main id="app"><section class="loading"><div class="kicker">Checking trusted sources</div><h1>Your financial radar<br><em>is coming into focus.</em></h1></section></main>
<aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-head"><div><span class="kicker">Dig in</span><h2 id="drawer-title">Tutor</h2></div><button id="drawer-close" class="icon-btn" aria-label="Close tutor">×</button></div><div id="chat" class="chat"></div><form id="chat-form" class="chat-form"><label class="search-check"><input id="web-search" type="checkbox" checked> Include the card’s original source</label><div class="chat-compose"><textarea id="chat-input" rows="2" placeholder="What would you like to understand?" required></textarea><button aria-label="Send question">↑</button></div></form></aside><div id="scrim" class="scrim"></div>
<script src="/static/app.js" defer></script></body></html>
